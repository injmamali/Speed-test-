<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedTest Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">Speed<span>Test</span></div>
      <p>Internet Speed Test</p>
    </header>

    <main class="card">

      <div class="gauge">
        <div class="gauge-inner">
          <div id="speed">0</div>
          <small>Mbps</small>
        </div>
      </div>

      <div class="status" id="status">
        Ready to test
      </div>

      <button id="startBtn">START TEST</button>

      <div class="results">

        <div class="result-box">
          <div class="icon">↓</div>
          <span>Download</span>
          <strong id="download">--</strong>
          <small>Mbps</small>
        </div>

        <div class="result-box">
          <div class="icon">↑</div>
          <span>Upload</span>
          <strong id="upload">--</strong>
          <small>Mbps</small>
        </div>

        <div class="result-box">
          <div class="icon">⌁</div>
          <span>Ping</span>
          <strong id="ping">--</strong>
          <small>ms</small>
        </div>

      </div>

      <div class="server">
        <span>Server</span>
        <strong id="server">Auto Select</strong>
      </div>

    </main>

    
<footer class="footer">
  <div class="footer-line"></div>

  <p>
    Designed & Developed by
    <span>Injmam Ali</span>
  </p>

  <small>© 2026 SpeedTest Pro. All rights reserved.</small>
</footer>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
